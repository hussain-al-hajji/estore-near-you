# يرسل طلبًا خفيفًا لقاعدة البيانات كل 3 أيام حتى لا يوقف Supabase المشروع المجاني بسبب عدم النشاط
# (الخطة المجانية توقف المشروع بعد أسبوع بدون نشاط). المفتاح هنا هو المفتاح العام نفسه الظاهر في الموقع.
name: Keep Supabase active

on:
  schedule:
    - cron: '17 5 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST \
            "https://yvsecrfyyzcnjizzckpt.supabase.co/rest/v1/rpc/get_banners" \
            -H "apikey: sb_publishable_3UCJXbdw-J6COp_XBUNNKg_gS-hKKD_" \
            -H "Content-Type: application/json" \
            -d '{"p_region": null, "p_count": false}')
          echo "HTTP $code"
